# Production overlay: adds HTTPS in front of the app.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# The app and database stay bound to 127.0.0.1; only Caddy is reachable from outside.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
  app:
    restart: unless-stopped
  db:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
